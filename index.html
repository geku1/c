<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transición frase a ojo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <!-- Capa de frase -->
    <section id="textScene" class="layer active">
      <div class="bg-noise"></div>
      <div class="vignette"></div>

      <div class="text-wrap">
        <p class="top-text">Ella: no soy tan bonita, no exageres.</p>
        <h1 class="main-text">Yo al verla</h1>
      </div>
    </section>

    <!-- Flash / transición -->
    <section id="flashScene" class="layer">
      <div class="flash-core"></div>
      <div class="flash-ring"></div>
    </section>

    <!-- Escena del ojo -->
    <section id="eyeScene" class="layer">
      <div class="vignette strong"></div>
      <div class="particles" id="particles"></div>

      <div class="eye-wrapper">
        <div class="eye-glow"></div>

        <div class="eye chroma">
          <div class="eye-shadow"></div>

          <div class="sclera"></div>

          <div class="iris">
            <div class="iris-texture"></div>
            <div class="pupil"></div>

            <div class="reflection reflection-1"></div>
            <div class="reflection reflection-2"></div>
            <div class="reflection reflection-3"></div>
          </div>

          <div class="shine"></div>
          <div class="lower-shine"></div>
        </div>

        <p class="eye-caption">Yo al verla</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>

</html>
